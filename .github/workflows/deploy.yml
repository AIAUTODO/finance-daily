name: 生成金融行情页并部署

on:
  # 每天定时更新（UTC 23:00 = 北京 07:00 / 迪拜 03:00）
  schedule:
    - cron: '0 23 * * *'
  # 支持手动触发
  workflow_dispatch:
  # 代码变更时也跑一次
  push:
    branches: [main]
    paths:
      - 'build.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成行情页
        run: python build.py

      # 推送 finance.html / index.html → Cloudflare Pages 自动重新部署，
      # finance.ilong.dpdns.org 即指向这两份页面
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finance.html index.html
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新行情 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
